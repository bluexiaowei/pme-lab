name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的版本 tag（如 v0.1.0），留空则用当前 versionName"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build APK & publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VN=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
            TAG="v${VN}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - name: Unit tests
        run: ./gradlew :pme-sdk:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare APK asset
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          cp "$SRC" "dist/pme-lab-${{ steps.ver.outputs.tag }}-debug.apk"
          ls -la dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          APK="dist/pme-lab-${TAG}-debug.apk"
          TITLE="PME Lab ${TAG}"
          NOTES="$(cat <<EOF
          ## 下载

          - \`pme-lab-${TAG}-debug.apk\`：Debug 包（联调用，已用 debug 签名）

          ## 说明

          - 非临床用途，仅供 BLE 协议联调
          - 安装前请允许未知来源，或使用 \`adb install -r pme-lab-*-debug.apk\`
          - 对应提交：\`${{ github.sha }}\`
          EOF
          )"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "$APK" \
              --target "${{ github.sha }}" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi
